[project]
name = "tree-options"
version = "0.1.0"
description = "Point-in-time equity signal research through options: protocol and invariant harness (M0)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=2.3.1",
    "types-pyyaml>=6.0.12.20260815",
]
trex = [
    "ib-async>=2.1.0",
]
trex-web = [
    # Read-only status panel (HTTP). Kept broker-free: never pulls ib_async
    # so the base env / test gate stays green without an IB Gateway.
    "fastapi>=0.110,<0.116",  # pin upper: fastapi 0.116 pins starlette >=1.0 which drops anyio compat
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",  # required by fastapi.testclient.TestClient
    "anyio>=4.0,<4.8",  # pin upper: anyio 4.8 deprecates BlockingPortal; starlette 0.x still uses it
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tree_options"]

[tool.uv]
# uv.lock is committed; `uv sync --locked` is the canonical install (CLI flag).

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter tolerance; long Decimal literals allowed
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Fail-closed default: strict about unexpected warnings would be nice, but the
# gate is the mutation harness; keep the run deterministic instead.
filterwarnings = [
    "error::DeprecationWarning:tree_options.*",
    # starlette 1.0+ uses anyio.abc.BlockingPortal which is deprecated by
    # anyio itself; the test surface is unaffected. Without this filter the
    # trex_web tests blow up on `-W error` from starlette's own import path.
    "ignore:.*BlockingPortal.*deprecated",
    "ignore::DeprecationWarning:anyio._lazyimport",
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.mypy]
python_version = "3.12"
files = [
    "src/tree_options",
    "scripts/capture_massive_structural.py",
    "scripts/inspect_structural_coverage.py",
    "scripts/runstate_mark.py",
    "scripts/era_status.py",
    "scripts/gen_coverage_universe.py",
    "scripts/build_coverage_census.py",
    "scripts/build_protocol_amendment.py",
    "scripts/capture_spot_proxy_v2.py",
    "scripts/build_lane1_manifest.py",
    "scripts/g4_seal.py",
    "scripts/launch_bars_era.py",
]
mypy_path = "src"
# The point is catching real unit/ordering bugs, not satisfying a strictness
# profile; individual modules may tighten later.
check_untyped_defs = true
warn_unused_ignores = false
