# Options desk playbook v2 (plan D5), the ACTIVE version. SEALED: v2.sha256
# holds the sha256 of this file's bytes, SEALS.md its one seal row, and
# tree_options.desk.playbook.APPROVED pins the same digest in code;
# load_playbook refuses any mismatch. A change is a new version (v3.toml);
# this file is never edited. v1.toml stays byte-for-byte as sealed history.
#
# v2 = v1 plus exactly these changes (2026-09-23, nothing else differs):
# 1. OPERATOR RULING 2026-09-23 ("debit spreads skip it"): row R1, the
#    XSMOM call DEBIT spread, may match while the name's vol state is
#    NOT_EVALUABLE (the warm-up). Rationale: a vertical's long and short
#    legs largely cancel vega, so the vol state matters little to it. Once
#    the state is evaluable it gates R1 exactly as in v1 (cheap or fair).
#    Credit spreads, condors and diagonals (R2, R4, R6) keep waiting; R3
#    (PEAD) was never vol-gated. Every when table states vol_not_evaluable:
#    match (R1 only; the loader allows it on debit verticals only),
#    no_match (wait), or n/a (the row has no vol condition).
# 2. Codex P2-4: PEAD's incremental drift is 0 until a date- and
#    beta-matched excess is established by its own pre-registration. The
#    raw beat mean stays below as descriptive text only.
# 3. Codex P2-5: the diagonal row R6 declares protective_strike_rule; the
#    candidate selection must check the ACTUAL strikes (long call strike
#    below the short), which the |delta| ranges cannot certify across two
#    expiries (desk.playbook.require_protective is the check).
#
# The vol-state cut-offs, minimum history and warm-up rule are v1's,
# fixed before any condition was computed on real data. Every value is
# explicit: the loader has no defaults. Money is a string.

schema = "desk-playbook/2"
version = "v2"
written = "2026-09-23"
plan = "~/.claude/plans/ok-those-charts-need-eager-bumblebee.md, D5 (approved 2026-09-23)"
# Strike selection reads |delta| from our own chain IVs: the mid inverted by
# massive_derived.implied_vol, analytic Black-Scholes delta at that IV, q = 0
# (desk/surface.py chain_quotes). The vendor's delta column is never used.
delta_source = "desk.surface.chain_quotes: own BS delta at the mid-implied IV, q = 0"

# ---------------------------------------------------------------- limits
# The rails lane (desk/rails.py) loads this table with the same schema.
[limits]
max_loss_per_trade_usd = "500"
max_book_loss_usd = "5000"
max_per_underlying = 2
max_net_beta_delta_usd_per_1pct_spy = "250"
max_admissions_per_session = 3
max_roundtrip_cost_frac_of_max_loss = "0.15"
min_leg_open_interest = 100
max_leg_spread_frac_of_mid = "0.10"
min_long_single_abs_delta = "0.30"
max_chain_age_sessions = 1
max_book_short_vega_usd_per_volpt = "100"

# ------------------------------------------------------------- vol state
# Why not the plan's fixed cut-offs (IV30/forecast < 1.0 / <= 1.25 / > 1.25):
# ATM IV runs 2.1-2.9 vol points below the CBOE variance-swap indices
# (IVHIST-001, structural: the indices integrate the wings) and the HAR
# forecast is a bias-corrected mean variance, so sqrt(E[var]) >= E[vol]
# (FORECAST-001 results). IV30 / sqrt(forecast) therefore sits below 1 by
# construction and a fixed 1.0 line would call almost everything "cheap".
#
# The choice: R = IV30 / HAR vol, where IV30 is the chain-mid ATM 30-day IV
# and HAR vol the h=20 HAR variance forecast annualized over the window's
# calendar days (both from desk features, desk-features/1). The state is
# the PERCENTILE of today's R within the SAME NAME's own R history:
#   p = (number of history values strictly below today's R) / n
#   cheap if p < cheap_below, rich if p > rich_above, else fair.
# A constant structural offset (ATM vs variance swap, the sqrt bias) moves
# every value of a name alike and cancels in its own percentile.
#
# Source consistency: today's R and every history value come from the
# recorded CBOE chains through desk features (source = "chain"); a history
# value whose features schema differs from today's is not counted. The
# IVHIST-001 VWAP history (Polygon bars) is NEVER mixed in: its window ended
# 2026-09-03, the chain store starts 2026-09-22, so there is no overlap on
# which to measure an offset between the sources (cross_source =
# "forbidden"). IVHIST-001 also excludes low-fidelity VWAP histories from
# any rule that thresholds IV rank or level. Bridging the sources needs a
# new sealed version with the offset measured on overlapping sessions.
#
# Warm-up: history = the name's evaluable R values in the window_sessions
# NYSE sessions strictly before the session. Fewer than min_history values
# -> NOT_EVALUABLE ("warm-up n/120"). Never a guess, never "fair". A
# session whose HAR status is not "validated" (earnings schedule unknown,
# FORECAST-001) or that lacks IV30 is not evaluable and not counted.
# With the recorder live from 2026-09-22 the first evaluable state is the
# 121st recorded session: 2027-03-16 at the earliest, one session later for
# every session the recorder misses. Until then R2 and R4 stay unmatched and
# R6 waits on the same warm-up for its steep-contango percentile; R1 (v2
# ruling) may match without a vol state; R3, R5, R7 need none.
#
# A features document counts only by its own metadata (Codex P1-2, checked
# in desk.regime): its session equals the session it stands for, the name's
# values come from a recorded chain, and the HAR forecast has the metric's
# horizon (20) with a fit dated before the session.
#
# Fidelity (IVHIST-001 run 2, the verdict of record by operator ruling
# 2026-09-23): only IWM's ATM IV tracked its index (RVX). IWM uses the
# validated band. Every other name (low-fidelity or not-evaluable in
# IVHIST-001) uses the WIDER unvalidated band, and only on rows whose
# iv_fidelity is "unvalidated_wide_band"; rows with "validated_only" refuse
# those names outright.
[vol_state]
metric = "iv30_over_har20"
source = "chain"
features_schema = "desk-features/1"
cross_source = "forbidden"
window_sessions = 252
min_history = 120
cheap_below = "1/3"
rich_above = "2/3"
unvalidated_cheap_below = "1/5"
unvalidated_rich_above = "4/5"
validated_names = ["IWM"]
validated_basis = "IVHIST-001 run 2 (verdict of record, operator ruling 2026-09-23): RVX~IWM PASS; all other pairs FAIL on bias or NOT_EVALUABLE"
har_status_required = "validated"

# ---------------------------------------------------------- term structure
# Name term: slope = IV90/IV30 - 1 from the same chain (desk features
# term_slope). contango if > 0, backwardation if < 0, flat if 0: needs no
# history. "steep" contango = slope > 0 AND its percentile within the
# name's own slope history (same window, same warm-up rule) > steep_above.
# Market term: VIX vs VIX3M closes dated the session itself (the market
# lane's stored CBOE histories); contango if VIX < VIX3M. Event inversion
# (row 5): around the next counted macro event inside the event window,
# front = the first chain expiry after the event date with DTE >=
# event_front_min_dte, back = the first expiry at least
# event_back_min_gap_days later; inverted if front ATM IV > back ATM IV.
[term]
slope = "iv90_over_iv30_minus_1"
steep_above = "2/3"
window_sessions = 252
min_history = 120
market_front = "VIX"
market_back = "VIX3M"
event_front_min_dte = 7
event_back_min_gap_days = 21

# ----------------------------------------------------------------- events
# Window: the next window_sessions NYSE sessions after the session (the
# session's own events are past when the conditions are computed after its
# close). Earnings: sealed calendar plus the market lane's timing file,
# confirmed AND estimated (estimated dates may block, never trigger). A
# reporter whose schedule does not pin the window (har.schedule_status not
# "complete") is "unknown", never "none". ETFs: a mapped large holding
# (events.ETF_HOLDINGS) reporting inside the window flags the ETF. Macro:
# the sealed macro calendar; a window outside its sealed range, or inside
# a year with a declared CPI/NFP gap, is "unknown".
[events]
window_sessions = 5
macro_kinds = ["cpi", "fomc", "fomc_unscheduled", "nfp"]
earnings_statuses = ["confirmed", "estimated", "sealed"]
etf_holdings = "count"

# ------------------------------------------------------------------ drift
# The deal miner's path model (plan D6) drifts at the risk-free rate with no
# view, and at risk-free + signal_weight x excess_20 on signal rows. The
# excess is the backtest's 20-session CONDITIONAL excess where one exists,
# pinned here before any deal is mined. PEAD has no such figure (Codex
# P2-4): its incremental drift is 0 until a date- and beta-matched excess
# is established by its own pre-registration; half of a raw mean would add
# market beta to "signal EV".
[drift]
signal_weight = "0.5"
horizon_sessions = 20

[drift.excess_20]
xsmom_top3 = "0.00962"
pead_beat = "0"

[drift.excess_basis]
xsmom_top3 = "XSMOM-12-1.md row 'no-skip | orig-36 | top3 | h20 | holdout': conditional +0.962% over the hold-everything base (the sealed rule's construction and universe; the more conservative era; full era +2.975%)"
pead_beat = "0: incremental drift withheld until a date- and beta-matched excess is established by its own pre-registration (Codex P2-4, 2026-09-23). Descriptive only, never a drift: PROTOCOL-PEAD.md beat-proxy n=63, +6120 USD at 2500 USD/leg = +3.89% per 20 sessions RAW, market beta included (2024-10..2026-08)"

# ------------------------------------------------------------------ xsmom
[xsmom]
ranking = "close(t)/close(t-273)-1, the TESTED no-skip construction (operator ruling 2026-09-23, RESEARCH-LEDGER DATA INTEGRITY)"
no_options_expression = ["SQQQ", "TQQQ"]
policy = "log_never_substitute"

# ================================================================== rows
# Tiers: signal-validated (the direction survived the research program's
# backtests; the OPTIONS expression is not validated), textbook-prior (a
# common options practice with no evidence of our own), risk-control.
# when.direction: bull / none / any (bear only on dormant rows); a bull row
# names the allowed direction signals that point it. news = block_if_flagged
# (the Wave 3 news model is veto-only; absent = no flag), or ignore (risk
# control only). dte is calendar days to expiry at entry. time_stop: the
# exit deadline is the EARLIEST of entry + hold_sessions NYSE sessions, the
# last session with at least min_dte days to the first expiry, and
# sessions_after_event sessions after the event; "none" disables one.

[[rows]]
id = "R1"
number = 1
title = "XSMOM top-3, vol cheap or fair: call debit spread"
tier = "signal-validated"
evidence = "XSMOM-TOP3 no-skip (PROTOCOL-XSMOM.md 46 months; XSMOM-12-1.md); the options expression is NOT validated (DESK-BT-001 will model it)"
status = "active"
kind = "debit_vertical"
max_open = 3
iv_fidelity = "unvalidated_wide_band"

[rows.when]
direction = "bull"
signals = ["xsmom_top3"]
vol = ["cheap", "fair"]
# operator ruling 2026-09-23: a vertical's long and short legs largely
# cancel vega, so R1 may match while the vol state is NOT_EVALUABLE; an
# evaluable state still gates it (cheap or fair only)
vol_not_evaluable = "match"
name_term = "any"
market_term = "any"
events = "any"
front_over_back = "any"
book = "any"
news = "block_if_flagged"

[rows.universe]
names = "chain_universe"
min_liquidity_score = 10

[[rows.legs]]
role = "long"
right = "C"
action = "BUY"
strike = "by_delta"
abs_delta = ["0.55", "0.70"]
dte = [120, 180]

[[rows.legs]]
role = "short"
right = "C"
action = "SELL"
strike = "by_delta"
abs_delta = ["0.30", "0.40"]
dte = "same_as_long"

# touch off: the long leg is in the money at entry (spot is already above
# its strike). Take-profit only near the cap: XSMOM-EXITGRID found 0/26
# exit variants beat holding. No stop: the debit is the defined max loss.
[rows.exits]
touch = false
breach = false
take_profit = { basis = "width_frac", value = "0.90" }
stop_loss = "none"
stop_confirm_ticks = 3

[rows.exits.time_stop]
