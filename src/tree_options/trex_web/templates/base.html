<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>{% block title %}trex options cockpit{% endblock %}</title>
<style>
  :root { font: 16px/1.55 system-ui, sans-serif; color: #e9edf6; background: #101725; color-scheme: dark; }
  body { margin: 0; padding: 24px; max-width: 1180px; margin: 0 auto; }
  header { display: flex; align-items: flex-start; justify-content: space-between; padding-bottom: 18px; border-bottom: 1px solid #344259; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 1.6rem; margin: 6px 0 0; letter-spacing: -0.02em; }
  .eyebrow { color: #9de2ca; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.72rem; font-weight: 700; }
  .muted { color: #b1bdd0; }
  a { color: #9de2ca; text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.86rem; }
  pre { background: #0b1322; padding: 12px; border-radius: 8px; overflow-x: auto; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; }
  .badge-planned { background: #25334a; color: #b1bdd0; }
  .badge-enter_working { background: #5a4a1f; color: #f4d77f; }
  .badge-open { background: #1f4a32; color: #9de2ca; }
  .badge-exit_working { background: #5a2f1f; color: #f4a877; }
  .badge-closed { background: #344259; color: #e9edf6; }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); }
  .card { border: 1px solid #344259; border-radius: 14px; padding: 20px; background: #1b2638; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card h2, .card h3 { margin: 0 0 8px; }
  .card h2 { font-size: 1.2rem; }
  .card h3 { font-size: 1.05rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #25334a; font-size: 0.92rem; }
  th { color: #b1bdd0; font-weight: 600; font-size: 0.82rem; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
  .pill-armed { background: #1f4a32; color: #9de2ca; }
  .pill-disarmed { background: #5a2f1f; color: #f4a877; }
  .pill-empty { background: #344259; color: #b1bdd0; }
  .strike { font-variant-numeric: tabular-nums; font-weight: 600; }
  .empty-state { text-align: center; padding: 80px 20px; color: #b1bdd0; }
  .empty-state .icon { font-size: 3rem; margin-bottom: 20px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 8px 0 0; }
  .kv dt { color: #b1bdd0; font-size: 0.86rem; }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  .pnl-pos { color: #9de2ca; }
  .pnl-neg { color: #f4a877; }
  footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #344259; color: #b1bdd0; font-size: 0.85rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">trex · read-only cockpit</div>
    <h1>{% block heading %}Options book{% endblock %}</h1>
  </div>
  <div style="text-align: right;">
    <a href="{{ home | default('/') }}">All plans</a>
    <p class="muted" style="margin: 4px 0 0; font-size: 0.82rem;">auto-refresh 30s · broker-free</p>
  </div>
</header>
{% block content %}{% endblock %}
<footer>
  <span>loopback only · reads <code>~/.local/state/trex/&lt;plan&gt;/</code> + plan TOML</span>
  <span>{% block footer_extra %}{% endblock %}</span>
</footer>
</body>
</html>
