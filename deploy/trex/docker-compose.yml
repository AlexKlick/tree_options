# IB Gateway (IBC) in paper mode for trex.
# Credentials: cp ib.env.example ~/.config/trex/ib.env (chmod 600) and fill in.
# Paper API lands on 127.0.0.1:4002.
#
# The gateway image ships **x11vnc** (raw VNC on 5900), not noVNC — and it
# only starts x11vnc when VNC_SERVER_PASSWORD is set. The `novnc` sidecar
# below bridges that VNC session to a browser UI on 127.0.0.1:6080 for the
# rare manual login / 2FA look: open /vnc.html?path=vnc (its socket is /vnc).
# x11vnc can lose a boot race with Xvfb and exit; the trex-gateway-watch
# timer restarts it (and alerts on a stuck login).
#
# Both host bindings stay on loopback. To reach the noVNC UI from another
# machine, put it on the tailnet with `tailscale serve` (tailnet-only) —
# never `tailscale funnel`, which would publish a live broker session.
services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:10.51.1a
    container_name: trex-ib-gateway
    restart: unless-stopped
    env_file: ${TREX_IB_ENV:-/home/alexk/.config/trex/ib.env}
    environment:
      TRADING_MODE: paper
      # The gateway defaults its API to Read-Only, which rejects
      # ReqOpenOrders/placeOrder. trex needs order rights on the paper
      # account. (Equivalent GUI path: Configure > Settings > API >
      # Settings > uncheck "Read-Only API".)
      READ_ONLY_API: "no"
      # Session survival (2026-09-23 incident). Without AUTO_RESTART_TIME the
      # gateway fell back to a daily LOG OFF at 11:45 PM container time (UTC =
      # 19:45 ET) and needed a full re-login every evening. Auto-Restart keeps
      # the session through the daily restart without re-authentication; IBKR
      # still forces a full login weekly, done by the Sunday cold restart at a
      # sociable hour for a 2FA prompt.
      # Timezones: TZ sets the JVM zone, which IBC's ColdRestartTime uses
      # (Sunday 12:00 ET). The Gateway's own zone is jts.ini TimeZone, seeded
      # from TIME_ZONE only when jts.ini is first created; ours already exists
      # in the ibgw-settings volume as Africa/Abidjan (GMT). So the daily
      # restart lands at 23:45 GMT (19:45 EDT) or 23:45 ET, depending on which
      # zone the Gateway applies: both after the close. Check the first one
      # in the log.
      TZ: America/New_York
      AUTO_RESTART_TIME: "11:45 PM"
      TWS_COLD_RESTART: "12:00"
      # An unanswered 2FA prompt re-prompts instead of stalling forever.
      TWOFA_TIMEOUT_ACTION: restart
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      # The default ('manual') parks on an "existing session" dialog: another
      # silent stall. 'primary' keeps this session and needs no human.
      EXISTING_SESSION_DETECTED_ACTION: primary
    # The host's uplink DNS list leads with a stale LAN resolver, so Docker's
    # embedded resolver stalls and the gateway reports "No Internet connection"
    # while raw-IP egress still works. Pin public resolvers.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      # The gateway binds its API to container-localhost only; the image's
      # socat bridge on 4004 is the externally reachable end. Host 4002
      # (what trex connects to) -> container 4004 -> gateway's 127.0.0.1:4002.
      - "127.0.0.1:4002:4004"
    volumes:
      - ibgw-settings:/home/ibgateway
    healthcheck:
      # The image ships no `nc` — socat is present (the image's own 4004
      # bridge uses it). Probe the gateway's API socket directly.
      test: ["CMD-SHELL", "socat /dev/null TCP:127.0.0.1:4002,connect-timeout=5 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

  novnc:
    image: geek1011/easy-novnc:latest
    container_name: trex-novnc
    restart: unless-stopped
    depends_on:
      - ib-gateway
    command:
      - --addr=:6080
      - --host=ib-gateway
      - --port=5900
      - --basic-ui
      - --no-url-password
    ports:
      - "127.0.0.1:6080:6080"

volumes:
  ibgw-settings:
